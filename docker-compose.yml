services:
  image-service:
    build: .
    container_name: image-service
    network_mode: host
    env_file:
      - .env
    environment:
      - ENV=production  # JSON logs for Loki; local dev keeps the console renderer
      - HTTP_PROXY=http://127.0.0.1:7897
      - HTTPS_PROXY=http://127.0.0.1:7897
      - NO_PROXY=localhost,127.0.0.1
    volumes:
      - ./storage:/app/storage
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
