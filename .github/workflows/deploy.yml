name: Deploy to Dev Server
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Ruff lint
        run: ~/.local/bin/ruff check .
      - name: Architecture check
        run: python3 scripts/check_architecture.py
  deploy:
    needs: check
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Record start time
        run: echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

      - name: Deploy
        run: |
          cd ~/project/image-service
          git pull origin main
          docker compose up -d --build
          docker image prune -f

      - name: Push deploy metrics
        if: always()
        run: bash ~/scripts/push-deploy-metrics.sh image-service main ${{ job.status }} ${{ env.BUILD_START }}
